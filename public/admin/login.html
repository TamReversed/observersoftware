<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Admin sign in | Observer</title>
  <link rel="stylesheet" href="/styles/admin-login.css">
</head>
<body>
  <main class="login-container">
    <a href="/" class="login-logo" aria-label="Observer, back to the site"><img src="/assets/brand/observer-wordmark.svg" alt="Observer" width="150" height="41"></a>
    <h1 class="login-title">Admin sign in</h1>
    <p class="login-subtitle">Sign in to manage the site.</p>

    <div class="login-card" id="loginCard">
      <div class="error-message" id="errorMessage" role="alert"></div>

      <div id="webauthnSection">
        <div class="form-group">
          <label class="form-label" for="webauthnUsername">Username</label>
          <input type="text" id="webauthnUsername" name="username" class="form-input" required autocomplete="username">
        </div>

        <button type="button" class="login-button" id="passkeyButton">
          <span id="passkeyButtonText">Sign in with Passkey</span>
        </button>

        <details class="login-more">
          <summary>Use a password, or set up a passkey</summary>
          <form id="passwordForm">
            <div class="form-group">
              <label class="form-label" for="passwordUsername">Username</label>
              <input type="text" id="passwordUsername" name="username" class="form-input" required autocomplete="username">
            </div>
            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-button login-button--outline" id="passwordLoginButton">Sign In with Password</button>
          </form>
          <div class="login-register">
            <button type="button" class="login-button login-button--outline" id="registerPasskeyButton">Register Passkey</button>
            <p class="login-hint">To register a passkey, enter your username and password above first.</p>
          </div>
        </details>
      </div>
    </div>

    <a href="/" class="back-link">&larr; Back to site</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@9.0.1/dist/bundle/index.umd.min.js" integrity="sha384-9+Bm5pUMP2324xMjhRahdomA9HaTxP6JcMhbl3tUAcV2+Jiohq8/T+dGj/rx/MaM" crossorigin="anonymous"></script>
  <script src="/scripts/admin-login.js"></script>
</body>
</html>
