<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Offline | Observer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #121113; color: #ece8e4; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; }
        img { width: min(280px, 70vw); margin: 0 auto 24px; display: block; }
        h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 500; letter-spacing: -0.03em; margin: 0 0 12px; }
        p { color: #a39e99; margin: 0 0 28px; }
        button { background: #e0565b; color: #121113; border: 0; padding: 16px 24px; font: inherit; font-weight: 500; cursor: pointer; }
        button:focus-visible { outline: 2px solid #ece8e4; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img src="/assets/states/offline.webp" alt="" width="280" height="280">
        <h1>You are offline.</h1>
        <p>Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
